# SPDX-License-Identifier: BSD-3-Clause
# Amazon Echo Plus (2nd generation): MT8516 AFE, TLV320AIC3204 DAC for the
# speaker amplifier and the line-out jack, four TLV320ADC3101 for the
# microphone array.
Syntax 4

SectionUseCase."HiFi" {
	File "/MediaTek/amazon-lidar/HiFi.conf"
	Comment "Default"
}

BootSequence [
	# Microphones: differential inputs DIF_2L_3L / DIF_2R_3R, PGA +35 dB
	cset "name='ADC1 Left Input DIF_2L_3L Capture Switch' on"
	cset "name='ADC1 Right Input DIF_2R_3R Capture Switch' on"
	cset "name='ADC1 PGA Capture Switch' on,on"
	cset "name='ADC1 PGA Capture Volume' 70,70"
	cset "name='ADC2 Left Input DIF_2L_3L Capture Switch' on"
	cset "name='ADC2 Right Input DIF_2R_3R Capture Switch' on"
	cset "name='ADC2 PGA Capture Switch' on,on"
	cset "name='ADC2 PGA Capture Volume' 70,70"
	cset "name='ADC3 Left Input DIF_2L_3L Capture Switch' on"
	cset "name='ADC3 Right Input DIF_2R_3R Capture Switch' on"
	cset "name='ADC3 PGA Capture Switch' on,on"
	cset "name='ADC3 PGA Capture Volume' 70,70"
	cset "name='ADC4 Left Input DIF_2L_3L Capture Switch' on"
	cset "name='ADC4 Right Input DIF_2R_3R Capture Switch' on"
	cset "name='ADC4 PGA Capture Switch' on,on"
	cset "name='ADC4 PGA Capture Volume' 70,70"
	# Line out feeds the speaker amplifier, headphone out the jack; driver
	# gains as on Amazon's firmware (line out 0 dB, headphone +5 dB)
	cset "name='LOL Output Mixer L_DAC Switch' on"
	cset "name='LOR Output Mixer R_DAC Switch' on"
	cset "name='HPL Output Mixer L_DAC Switch' on"
	cset "name='HPR Output Mixer R_DAC Switch' on"
	cset "name='LO DAC Playback Switch' on,on"
	cset "name='HP DAC Playback Switch' on,on"
	cset "name='LO Driver Gain Volume' 6,6"
	cset "name='HP Driver Gain Volume' 11,11"
	# Start quiet: -40 dB; 127 (0 dB) is the speaker's full stock loudness
	cset "name='PCM Playback Volume' 47,47"
]
